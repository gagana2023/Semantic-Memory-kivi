<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1222">
  <meta name="description" content="Kivi is your private, grounded work memory.">
  <title>{% block title %}Kivi{% endblock %}</title>
  <link rel="stylesheet" href="/static/kivi.css">
</head>
<body data-page="{{ page }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="app-header">
    <a class="brand" href="/" aria-label="Kivi home">
      <span class="brand-mark" aria-hidden="true"><span>k</span></span>
      <span class="brand-name">kivi</span>
    </a>

    <nav class="mode-nav" aria-label="Choose how to use Kivi">
      <a href="/" {% if page == 'dictation' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M6 11.5v.5a6 6 0 0 0 12 0v-.5M12 18v3M8.5 21h7"/></svg>
        <span>Dictate</span>
      </a>
      <a href="/hey" {% if page == 'hey' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a7 7 0 0 1-7 7H8l-4 3 1.4-4.2A7 7 0 1 1 20 11Z"/><path d="M9 11h.01M13 11h.01M17 11h.01"/></svg>
        <span>Hey Kivi</span>
      </a>
      <a href="/memory" {% if page == 'memory' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5c-1.5-2-5.5-1.3-5.5 2.3 0 .5.1 1 .3 1.4-2.8.6-3.2 4.7-.6 5.8-1 2.8 2.5 5.1 4.7 3.1.4 2.4 3.8 2.4 4.2 0 2.2 2 5.7-.3 4.7-3.1 2.6-1.1 2.2-5.2-.6-5.8.2-.4.3-.9.3-1.4 0-3.6-4-4.3-5.5-2.3Z"/><path d="M12 4.5V20M8.5 9.5c1.5 0 2.6.8 3.5 2.1M15.5 14.5c-1.5 0-2.6.8-3.5 2.1"/></svg>
        <span>Memory</span>
      </a>
    </nav>

    <div class="local-pill" title="Kivi stores memory on this computer">
      <span class="local-pulse" aria-hidden="true"></span>
      <span>Private on this device</span>
    </div>
  </header>

  <main id="main" class="app-main">{% block content %}{% endblock %}</main>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script>
    window.kiviToast = (message, tone = '') => {
      const region = document.querySelector('#toast-region');
      const toast = document.createElement('div');
      toast.className = 'toast ' + tone;
      toast.textContent = message;
      region.appendChild(toast);
      setTimeout(() => toast.remove(), 4200);
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
