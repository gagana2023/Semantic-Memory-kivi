<!doctype html><link rel="stylesheet" href="/static/kivi.css"><title>Kivi — Dictation</title><nav><a href="/">Dictation</a> <a href="/hey">Hey Kivi</a> <a href="/inspect">Inspect</a></nav><h1>Dictation</h1><p>Writes your words, then processes stated entities in the background.</p><form id="d"><label>Raw ASR<textarea name="raw_asr" required></textarea></label><label>Formatted text<textarea name="formatted_text" required></textarea></label><button>Submit dictation</button></form><pre id="out"></pre><script>document.querySelector('#d').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await fetch('/v1/dictations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});out.textContent=await r.text()}</script>
